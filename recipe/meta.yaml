{% set SKIP_TEST_LIST = [
    "test_create",
    "test_delete",
    "test_modify",
    "test_chmod",
    "test_move",
    "test_case_change",
    "test_move_to",
    "test_move_from",
    "test_separate_consecutive_moves",
    "test_fast_subdirectory_creation_deletion",
    "test_recursive_on",
    "test_recursive_off",
    "test_renaming_top_level_directory",
    "test_move_nested_subdirectories",
    "test_file_lifecyle",
    "test_converting_cfstring_to_pyunicode",
    "test___init__",
    "test_delayed_get",
    "test_select_fd"
] %}

test:
  source_files:
    - tests
  requires:
    - pip
    - pytest
  imports:
    - watchdog
    - watchdog.observers
    - watchdog.tricks
    - watchdog.utils
    - watchdog.version
    - watchdog.observers.inotify          # [linux]
    - watchdog.observers.inotify_c        # [linux]
    - watchdog.observers.inotify_buffer   # [linux]
    - watchdog.observers.fsevents         # [osx]
    - watchdog.observers.kqueue           # [osx]
    - watchdog.observers.read_directory_changes  # [win]
    - watchdog.observers.winapi                  # [win]
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - watchmedo --help
    - export LC_ALL=en_US.UTF-8  # [unix]
    - pytest -ra -vv tests -k "not slow and not ({{ SKIP_TEST_LIST | join(' or ') }})"

about:
  home: https://github.com/gorakhargosh/watchdog
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE
    - COPYING
  summary: Filesystem events monitoring
  description: |
    Watchdog: Python API library and shell utilities to monitor file system events.
  doc_url: https://python-watchdog.readthedocs.io
  dev_url: https://github.com/gorakhargosh/watchdog

extra:
  recipe-maintainers:
    - goanpeca
    - rlaverde
    - ccordoba12
    - andfoy
    - tschoonj
